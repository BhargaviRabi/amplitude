<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoMinder</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  .subtitle {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .composer {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #memo-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  #add-memo-button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #add-memo-button:disabled {
    background: #a5a6f6;
    cursor: default;
  }
  ul#memo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.memo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  li.memo .memo-text {
    flex: 1;
    font-size: 14px;
  }
  li.memo.closed .memo-text {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .memo-actions button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    color: #6b7280;
    padding: 4px 8px;
  }
  .memo-actions button:hover {
    color: #111827;
  }
  .empty-state {
    color: #9ca3af;
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
  }
</style>
</head>
<body>

<div class="app">
  <h1>MemoMinder</h1>
  <div class="subtitle">Jot down a quick memo before you forget.</div>

  <div class="composer">
    <input id="memo-input" type="text" placeholder="Write a memo..." />
    <button id="add-memo-button" disabled>Add</button>
  </div>

  <ul id="memo-list"></ul>
  <div id="empty-state" class="empty-state">No memos yet.</div>
</div>

<!-- Amplitude Analytics -->
<script src="https://cdn.amplitude.com/script/6ec4e655d3c63c4a39b42dff50d8ecd4.js"></script>
<script>
  window.amplitude.init('6ec4e655d3c63c4a39b42dff50d8ecd4', {"autocapture":true});
</script>

<!-- Amplitude Experiment -->
<script src="https://unpkg.com/@amplitude/experiment-js-client@1.15.5/dist/experiment.umd.js"></script>
<script>
  const experiment = Experiment.initializeWithAmplitudeAnalytics('client-o7TvHdPmxvs1RTSlYhjhKo4BF7mQAXmZ');

  // Sets the add-memo button's label from the variant assigned by the
  // team-name-memominder-label experiment. Falls back to "Add" until the
  // assignment fetch resolves (variant() returns null before then).
  function setLabel() {
    const button = document.getElementById('add-memo-button');
    experiment.start().then(() => {
      const variant = experiment.variant('techvedika-memominder-label');
      const label = (variant && variant.payload && variant.payload.button_label) || 'Add';
      button.textContent = label;
      button.disabled = false;
    });
  }

  setLabel();
</script>

<script>
  const memoList = document.getElementById('memo-list');
  const memoInput = document.getElementById('memo-input');
  const addButton = document.getElementById('add-memo-button');
  const emptyState = document.getElementById('empty-state');
  let nextId = 1;

  function trackMemoInteracted(action, memoId) {
    window.amplitude.track('Memo Interacted', { action: action, memo_id: memoId });
  }

  function updateEmptyState() {
    emptyState.style.display = memoList.children.length ? 'none' : 'block';
  }

  function addMemo() {
    const text = memoInput.value.trim();
    if (!text) return;

    const id = nextId++;
    const li = document.createElement('li');
    li.className = 'memo';
    li.dataset.id = id;
    li.innerHTML =
      '<span class="memo-text"></span>' +
      '<span class="memo-actions">' +
      '<button class="close-memo">Close</button>' +
      '<button class="delete-memo">Delete</button>' +
      '</span>';
    li.querySelector('.memo-text').textContent = text;
    memoList.appendChild(li);

    memoInput.value = '';
    updateEmptyState();
    trackMemoInteracted('add', id);
  }

  function closeMemo(li) {
    li.classList.toggle('closed');
    trackMemoInteracted('close', Number(li.dataset.id));
  }

  function deleteMemo(li) {
    trackMemoInteracted('delete', Number(li.dataset.id));
    li.remove();
    updateEmptyState();
  }

  addButton.addEventListener('click', addMemo);
  memoInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addMemo();
  });

  memoList.addEventListener('click', function (e) {
    const li = e.target.closest('li.memo');
    if (!li) return;
    if (e.target.classList.contains('close-memo')) closeMemo(li);
    if (e.target.classList.contains('delete-memo')) deleteMemo(li);
  });

  updateEmptyState();
</script>

</body>
</html>
